# This workflow builds and tests the native addon across platforms, and
# publishes the package to GitHub Packages (https://github.com/mc-zuri?tab=packages)
# when changes land on master.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm test

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish when changes land on master (not on PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@mc-zuri'
      - run: npm install
        env:
          SKIP_BUILD: true
      # Publishes @mc-zuri/raknet-native to GitHub Packages. Skips gracefully
      # if this version was already published (e.g. master re-run without a bump).
      - name: Publish to GitHub Packages
        run: npm publish || echo "Publish skipped (version may already exist)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
